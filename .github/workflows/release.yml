name: release

# F004/S03: a pushed tag vX.Y.Z builds FamilyLightbox for Apple Silicon, signs it with Atomic Bits'
# Developer ID, notarizes it with Apple and publishes the .dmg on a GitHub Release. A manual run
# is a dry run by default: the same build and checks, nothing published. F004/S04 adds the
# updater: the signed .app.tar.gz, and latest.json on the release, uploaded last.
# F004/S06: one job per step (build, notarize, staple, package, publish), handing over artifacts,
# so "Re-run failed jobs" continues where Apple's network stopped a release, without building or
# notarizing again. Runbook: docs/releasing.md.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, sign and check only; publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always
  TARGET: aarch64-apple-darwin

jobs:
  build:
    name: build and sign (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.sign.outputs.enabled }}
      updater: ${{ steps.sign.outputs.updater }}
    steps:
      - name: Checkout (full history, for the leak check)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version, and the tag that must match it
        id: version
        run: |
          set -euo pipefail
          conf=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          pkg=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tauri.conf.json=$conf package.json=$pkg Cargo.toml=$cargo"
          if [ "$conf" != "$pkg" ] || [ "$conf" != "$cargo" ]; then
            echo "::error::the three versions differ (scripts/bump-version.py keeps them equal)"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_NAME}" != "v$conf" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} doesn't match version $conf"
            exit 1
          fi
          echo "version=$conf" >> "$GITHUB_OUTPUT"

      - name: Signing secrets present?
        id: sign
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          tag=$([ "${{ github.event_name }}" = "push" ] && echo true || echo false)
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$tag" = true ]; then
            echo "::error::a release must be signed: the APPLE_* secrets are missing (docs/releasing.md)"
            exit 1
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no APPLE_* secrets: this dry run builds UNSIGNED"
          fi
          # F004/S04: the update payload needs the update key; installed apps only trust that key
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "updater=true" >> "$GITHUB_OUTPUT"
            echo "config=" >> "$GITHUB_OUTPUT"
          elif [ "$tag" = true ]; then
            echo "::error::a release must carry an update: the TAURI_SIGNING_* secrets are missing (docs/releasing.md)"
            exit 1
          else
            echo "updater=false" >> "$GITHUB_OUTPUT"
            # a file, not inline JSON: tauri-action splits args like a shell and would eat the quotes
            echo "config=--config $GITHUB_WORKSPACE/src-tauri/tauri.no-updater.json" >> "$GITHUB_OUTPUT"
            echo "::warning::no TAURI_SIGNING_* secrets: this dry run builds no update payload"
          fi

      - name: Install gitleaks
        run: brew install gitleaks

      - name: Leak check over the whole history
        env:
          LEAK_TERMS_CONTENT: ${{ secrets.LEAK_TERMS }}
        run: |
          set -eu
          if [ -z "$LEAK_TERMS_CONTENT" ]; then
            echo "::error::the repository secret LEAK_TERMS is missing (README, Development)"
            exit 1
          fi
          export LEAK_TERMS="$RUNNER_TEMP/leak-terms.txt"
          printf '%s\n' "$LEAK_TERMS_CONTENT" > "$LEAK_TERMS"
          python3 scripts/leak-check.py --history

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release

      - name: Frontend dependencies
        run: pnpm install --frozen-lockfile

      # Only the .app, signed with the Developer ID: no notarizing here (no APPLE_ID), no .dmg and
      # no update payload. Those are made from the stapled app in the jobs below (F004/S06).
      - name: Build and sign the app
        if: steps.sign.outputs.enabled == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          # a file, not inline JSON: tauri-action splits args like a shell and would eat the quotes
          args: --target ${{ env.TARGET }} --bundles app --config ${{ github.workspace }}/src-tauri/tauri.no-updater.json

      # A dry run without the secrets: the same build, without the signing environment at all.
      - name: Build (unsigned dry run)
        if: steps.sign.outputs.enabled != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ env.TARGET }} --bundles app --config ${{ github.workspace }}/src-tauri/tauri.no-updater.json

      # ditto keeps what an app needs (modes, the signature's files); a plain artifact upload wouldn't
      - name: Pack the app
        run: |
          set -euo pipefail
          app="src-tauri/target/$TARGET/release/bundle/macos/FamilyLightbox.app"
          if [ "${{ steps.sign.outputs.enabled }}" = true ]; then
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dvv "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|Timestamp)='
          fi
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent "$app" out/FamilyLightbox.app.zip
          ls -la out

      - name: Upload the signed app
        uses: actions/upload-artifact@v4
        with:
          name: app-signed
          path: out/FamilyLightbox.app.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  notarize:
    name: notarize the app
    needs: [build]
    if: needs.build.outputs.signed == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - uses: actions/download-artifact@v4
        with:
          name: app-signed
          path: in

      # a re-run finds this zip's earlier submission in Apple's history and waits for that one
      - name: Submit, or reuse an earlier submission, and wait
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 scripts/test_apple.py > /dev/null
          python3 scripts/apple.py notarize in/FamilyLightbox.app.zip

  staple:
    name: staple the ticket to the app
    needs: [build, notarize]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - uses: actions/download-artifact@v4
        with:
          name: app-signed
          path: in

      # fails when the ticket can't be stapled: nothing without a ticket goes on
      - name: Staple, validate, and Gatekeeper's check
        run: |
          set -euo pipefail
          ditto -x -k in/FamilyLightbox.app.zip unpacked
          python3 scripts/apple.py staple unpacked/FamilyLightbox.app
          python3 scripts/apple.py assess unpacked/FamilyLightbox.app execute
          codesign --verify --deep --strict --verbose=2 unpacked/FamilyLightbox.app
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent unpacked/FamilyLightbox.app out/FamilyLightbox.app.zip

      - name: Upload the stapled app
        uses: actions/upload-artifact@v4
        with:
          name: app-stapled
          path: out/FamilyLightbox.app.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  package:
    name: package the update and the .dmg
    needs: [build, staple]
    # an unsigned dry run skips notarizing and stapling and packages the signed-less app
    if: always() && needs.build.result == 'success' && (needs.staple.result == 'success' || (needs.staple.result == 'skipped' && needs.build.outputs.signed != 'true'))
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SIGNED: ${{ needs.build.outputs.signed }}
      UPDATER: ${{ needs.build.outputs.updater }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the stapled app
        if: env.SIGNED == 'true'
        uses: actions/download-artifact@v4
        with:
          name: app-stapled
          path: in

      - name: Download the app (unsigned dry run)
        if: env.SIGNED != 'true'
        uses: actions/download-artifact@v4
        with:
          name: app-signed
          path: in

      - name: Unpack
        run: |
          set -euo pipefail
          ditto -x -k in/FamilyLightbox.app.zip unpacked
          mkdir -p staging

      - name: Install pnpm
        if: env.UPDATER == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        if: env.UPDATER == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # the payload is the stapled app, signed with the update key: what the updater installs
      - name: The update payload
        if: env.UPDATER == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          COPYFILE_DISABLE=1 tar -czf staging/FamilyLightbox.app.tar.gz -C unpacked FamilyLightbox.app
          pnpm tauri signer sign staging/FamilyLightbox.app.tar.gz
          test -s staging/FamilyLightbox.app.tar.gz.sig || { echo "::error::no signature for the update payload"; exit 1; }

      # What the updater installs is the .app inside the .tar.gz: it must be the notarized one.
      - name: Check the app in the update payload
        if: env.UPDATER == 'true' && env.SIGNED == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/payload"
          tar -xzf staging/FamilyLightbox.app.tar.gz -C "$RUNNER_TEMP/payload"
          python3 scripts/apple.py assess "$RUNNER_TEMP/payload/FamilyLightbox.app" execute
          python3 scripts/apple.py validate "$RUNNER_TEMP/payload/FamilyLightbox.app"

      # The .dmg from the stapled app, with a link to Applications, as Tauri made it before.
      - name: The .dmg
        run: |
          set -euo pipefail
          mkdir -p dmgroot
          cp -R unpacked/FamilyLightbox.app dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname FamilyLightbox -srcfolder dmgroot -ov -format UDZO "staging/FamilyLightbox_${VERSION}_aarch64.dmg"
          hdiutil verify staging/*.dmg

      # Lynn downloads the .dmg through a browser, so it gets quarantined: the container is signed,
      # notarized and stapled too.
      - name: Sign, notarize and staple the .dmg
        if: env.SIGNED == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pw=$(openssl rand -hex 16)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pw" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$pw" "$keychain" > /dev/null
          # the keychains as separate words: none of their paths has a space
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          dmg=$(ls staging/*.dmg)
          codesign --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          python3 scripts/apple.py notarize "$dmg"
          python3 scripts/apple.py staple "$dmg"
          python3 scripts/apple.py assess "$dmg" open

      - name: Upload the release files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.VERSION }}
          path: staging/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: publish on the GitHub Release
    needs: [build, package]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout (the latest.json script)
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Download the release files
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.version }}
          path: artefacts
      - name: Build latest.json from the .sig
        run: |
          set -euo pipefail
          python3 scripts/test_build_latest_json.py
          python3 scripts/build-latest-json.py "${{ needs.build.outputs.version }}" artefacts "$GITHUB_REPOSITORY"
          cat artefacts/latest.json

      - name: Create the release, or add to it on a rerun
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            cat > notes.md <<'EOF'
          FamilyLightbox for macOS (Apple Silicon), signed with the Developer ID of Atomic Bits and notarized by Apple. Open the `.dmg` and drag FamilyLightbox to Applications.
          EOF
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "FamilyLightbox $TAG" \
              --notes-file notes.md --verify-tag
          fi
          # latest.json last: an app that looks meanwhile never sees a payload that isn't there yet
          for f in $(ls artefacts/* | grep -v '/latest.json$') artefacts/latest.json; do
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$f" -R "$GITHUB_REPOSITORY" --clobber; then
                echo "uploaded $(basename "$f")"
                continue 2
              fi
              echo "::warning::upload of $(basename "$f") failed (attempt $attempt of 5)"
              sleep $((attempt * 20))
            done
            echo "::error::giving up on $(basename "$f")"
            exit 1
          done
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.size)\t\(.name)"'
