name: release

# F004/S03: a pushed tag vX.Y.Z builds FamilyLightbox for Apple Silicon, signs it with Atomic Bits'
# Developer ID, notarizes it with Apple and publishes the .dmg on a GitHub Release. A manual run
# is a dry run by default: the same build and checks, nothing published. After wikai's
# release.yml (macOS only, no R2): build without uploading, then publish in a job of its own that
# can be rerun when GitHub's upload has a bad day. F004/S04 adds the updater: the signed
# .app.tar.gz, and latest.json on the release, uploaded last. Runbook: docs/releasing.md.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, sign and check only; publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always
  TARGET: aarch64-apple-darwin

jobs:
  build:
    name: build, sign and notarize (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout (full history, for the leak check)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version, and the tag that must match it
        id: version
        run: |
          set -euo pipefail
          conf=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          pkg=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tauri.conf.json=$conf package.json=$pkg Cargo.toml=$cargo"
          if [ "$conf" != "$pkg" ] || [ "$conf" != "$cargo" ]; then
            echo "::error::the three versions differ (scripts/bump-version.py keeps them equal)"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_NAME}" != "v$conf" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} doesn't match version $conf"
            exit 1
          fi
          echo "version=$conf" >> "$GITHUB_OUTPUT"

      - name: Signing secrets present?
        id: sign
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          tag=$([ "${{ github.event_name }}" = "push" ] && echo true || echo false)
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$tag" = true ]; then
            echo "::error::a release must be signed: the APPLE_* secrets are missing (docs/releasing.md)"
            exit 1
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no APPLE_* secrets: this dry run builds UNSIGNED"
          fi
          # F004/S04: the update payload needs the update key; installed apps only trust that key
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "updater=true" >> "$GITHUB_OUTPUT"
            echo "config=" >> "$GITHUB_OUTPUT"
          elif [ "$tag" = true ]; then
            echo "::error::a release must carry an update: the TAURI_SIGNING_* secrets are missing (docs/releasing.md)"
            exit 1
          else
            echo "updater=false" >> "$GITHUB_OUTPUT"
            # a file, not inline JSON: tauri-action splits args like a shell and would eat the quotes
            echo "config=--config $GITHUB_WORKSPACE/src-tauri/tauri.no-updater.json" >> "$GITHUB_OUTPUT"
            echo "::warning::no TAURI_SIGNING_* secrets: this dry run builds no update payload"
          fi

      - name: Install gitleaks
        run: brew install gitleaks

      - name: Leak check over the whole history
        env:
          LEAK_TERMS_CONTENT: ${{ secrets.LEAK_TERMS }}
        run: |
          set -eu
          if [ -z "$LEAK_TERMS_CONTENT" ]; then
            echo "::error::the repository secret LEAK_TERMS is missing (README, Development)"
            exit 1
          fi
          export LEAK_TERMS="$RUNNER_TEMP/leak-terms.txt"
          printf '%s\n' "$LEAK_TERMS_CONTENT" > "$LEAK_TERMS"
          python3 scripts/leak-check.py --history

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release

      - name: Frontend dependencies
        run: pnpm install --frozen-lockfile

      # tauri-action imports the .p12 into a temporary keychain, signs the .app, notarizes it with
      # notarytool, staples the ticket and builds the .dmg around it. No tagName/releaseName:
      # build only, publishing is the job below.
      - name: Build, sign and notarize
        if: steps.sign.outputs.enabled == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ env.TARGET }} ${{ steps.sign.outputs.config }}

      # A dry run without the secrets: the same build, without the signing environment at all.
      - name: Build (unsigned dry run)
        if: steps.sign.outputs.enabled != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ env.TARGET }} ${{ steps.sign.outputs.config }}

      - name: Collect the .dmg and the update payload
        id: dmg
        run: |
          set -euo pipefail
          bundle="src-tauri/target/$TARGET/release/bundle"
          ls -la "$bundle/dmg" "$bundle/macos"
          n=$(find "$bundle/dmg" -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')
          if [ "$n" != 1 ]; then
            echo "::error::expected exactly one .dmg, found $n"
            exit 1
          fi
          mkdir -p staging
          cp "$bundle"/dmg/*.dmg staging/
          echo "app=$(find "$bundle/macos" -maxdepth 1 -name '*.app' | head -1)" >> "$GITHUB_OUTPUT"
          hdiutil verify staging/*.dmg
          if [ "${{ steps.sign.outputs.updater }}" = true ]; then
            for pattern in '*.app.tar.gz' '*.app.tar.gz.sig'; do
              n=$(find "$bundle/macos" -maxdepth 1 -name "$pattern" | wc -l | tr -d ' ')
              if [ "$n" != 1 ]; then
                echo "::error::expected exactly one $pattern, found $n"
                exit 1
              fi
            done
            cp "$bundle"/macos/*.app.tar.gz "$bundle"/macos/*.app.tar.gz.sig staging/
          fi
          ls -la staging

      - name: Check signature and notarization
        if: steps.sign.outputs.enabled == 'true'
        env:
          APP: ${{ steps.dmg.outputs.app }}
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E '^(Authority|TeamIdentifier|Timestamp)='
          assessment=$(spctl --assess --type execute --verbose=4 "$APP" 2>&1)
          echo "$assessment"
          echo "$assessment" | grep -q "source=Notarized Developer ID" \
            || { echo "::error::not accepted as a notarized Developer ID app"; exit 1; }
          # Apple's ticket service drops connections now and then (seen twice on macos-15): retry
          for i in 1 2 3 4 5; do xcrun stapler validate "$APP" && break; [ "$i" = 5 ] && exit 1; echo "retry $i"; sleep 20; done

      # What the updater installs is the .app inside the .tar.gz: it must be the notarized one.
      - name: Check the app in the update payload
        if: steps.sign.outputs.enabled == 'true' && steps.sign.outputs.updater == 'true'
        run: |
          set -euo pipefail
          unpacked="$RUNNER_TEMP/payload"
          mkdir -p "$unpacked"
          tar -xzf staging/*.app.tar.gz -C "$unpacked"
          app=$(find "$unpacked" -maxdepth 1 -name '*.app' | head -1)
          assessment=$(spctl --assess --type execute --verbose=4 "$app" 2>&1)
          echo "$assessment"
          echo "$assessment" | grep -q "source=Notarized Developer ID" \
            || { echo "::error::the app in the update payload isn't notarized"; exit 1; }
          # Apple's ticket service drops connections now and then (seen twice on macos-15): retry
          for i in 1 2 3 4 5; do xcrun stapler validate "$app" && break; [ "$i" = 5 ] && exit 1; echo "retry $i"; sleep 20; done

      # tauri-action notarizes the .app but only signs the .dmg around it. Lynn downloads the .dmg
      # through a browser, so it gets quarantined: notarize and staple the outer container too.
      - name: Notarize and staple the .dmg
        if: steps.sign.outputs.enabled == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          dmg=$(ls staging/*.dmg)
          codesign --verify --strict --verbose=2 "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 30m --output-format json | tee notary.json
          status=$(python3 -c 'import json; print(json.load(open("notary.json"))["status"])')
          if [ "$status" != "Accepted" ]; then
            echo "::error::notarization of the .dmg: $status (docs/releasing.md, When something fails)"
            exit 1
          fi
          # Apple's ticket service drops connections now and then (seen twice on macos-15): retry
          for i in 1 2 3 4 5; do xcrun stapler staple "$dmg" && break; [ "$i" = 5 ] && exit 1; echo "retry $i"; sleep 20; done
          # Apple's ticket service drops connections now and then (seen twice on macos-15): retry
          for i in 1 2 3 4 5; do xcrun stapler validate "$dmg" && break; [ "$i" = 5 ] && exit 1; echo "retry $i"; sleep 20; done
          assessment=$(spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg" 2>&1)
          echo "$assessment"
          echo "$assessment" | grep -q "source=Notarized Developer ID" \
            || { echo "::error::the .dmg isn't accepted as notarized"; exit 1; }

      - name: Upload the release files as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ steps.version.outputs.version }}
          path: staging/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: publish on the GitHub Release
    needs: [build]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout (the latest.json script)
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Download the release files
        uses: actions/download-artifact@v4
        with:
          name: dmg-${{ needs.build.outputs.version }}
          path: artefacts

      - name: Build latest.json from the .sig
        run: |
          set -euo pipefail
          python3 scripts/test_build_latest_json.py
          python3 scripts/build-latest-json.py "${{ needs.build.outputs.version }}" artefacts "$GITHUB_REPOSITORY"
          cat artefacts/latest.json

      - name: Create the release, or add to it on a rerun
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            cat > notes.md <<'EOF'
          FamilyLightbox for macOS (Apple Silicon), signed with the Developer ID of Atomic Bits and notarized by Apple. Open the `.dmg` and drag FamilyLightbox to Applications.
          EOF
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "FamilyLightbox $TAG" \
              --notes-file notes.md --verify-tag
          fi
          # latest.json last: an app that looks meanwhile never sees a payload that isn't there yet
          for f in $(ls artefacts/* | grep -v '/latest.json$') artefacts/latest.json; do
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$f" -R "$GITHUB_REPOSITORY" --clobber; then
                echo "uploaded $(basename "$f")"
                continue 2
              fi
              echo "::warning::upload of $(basename "$f") failed (attempt $attempt of 5)"
              sleep $((attempt * 20))
            done
            echo "::error::giving up on $(basename "$f")"
            exit 1
          done
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.size)\t\(.name)"'
